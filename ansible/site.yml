---
- name: Configure web servers
  hosts: web
  become: true
  roles:
    - nginx
    - node_exporter
    - nginx_log_exporter

- name: Configure Elasticsearch
  hosts: elasticsearch
  become: true
  roles:
    - node_exporter
    - docker
    - elasticsearch

- name: Configure Kibana
  hosts: kibana
  become: true
  roles:
    - node_exporter
    - docker
    - kibana

- name: Configure Grafana
  hosts: grafana
  become: true
  roles:
    - node_exporter
    - docker
    - grafana

- name: Configure Prometheus
  hosts: prometheus
  become: true
  roles:
    - node_exporter
    - prometheus

- name: Ship logs with Filebeat
  hosts: all
  become: true
  roles:
    - docker
    - filebeat
