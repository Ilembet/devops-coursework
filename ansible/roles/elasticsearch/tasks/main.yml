---
- name: Raise vm.max_map_count for Elasticsearch
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-elasticsearch.conf
    content: "vm.max_map_count = 262144\n"
    mode: "0644"
  register: es_sysctl

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  when: es_sysctl.changed
  changed_when: true

- name: Create the Elasticsearch directory
  ansible.builtin.file:
    path: /opt/elasticsearch
    state: directory
    mode: "0755"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/elasticsearch/docker-compose.yml
    mode: "0644"

- name: Start Elasticsearch
  ansible.builtin.command: docker compose up -d
  args:
    chdir: /opt/elasticsearch
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"

- name: Wait until Elasticsearch answers
  ansible.builtin.uri:
    url: http://localhost:9200/_cluster/health
  register: es_health
  until: es_health.status == 200
  retries: 60
  delay: 10
