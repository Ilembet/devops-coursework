---
- name: Create the Kibana directory
  ansible.builtin.file:
    path: /opt/kibana
    state: directory
    mode: "0755"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/kibana/docker-compose.yml
    mode: "0644"

- name: Start Kibana
  ansible.builtin.command: docker compose up -d
  args:
    chdir: /opt/kibana
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"
